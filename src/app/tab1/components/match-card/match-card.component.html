<ion-card class="match-card">
  <ion-card-content>
    <div class="competition">
      <img [src]="match().competition_logo" alt="" class="competition-logo">
      <span class="competition-name">{{ match().competition }}</span>
    </div>

    <div class="match-main">
      <div class="team">
        <img [src]="match().home_logo" alt="" class="team-logo">
        <span class="team-name">{{ match().home }}</span>
      </div>
      <div class="score">
        <span>{{ match().home_score }} - {{ match().away_score }}</span>
      </div>
      <div class="team">
        <img [src]="match().away_logo" alt="" class="team-logo">
        <span class="team-name">{{ match().away }}</span>
      </div>
    </div>

    <div class="status">
      {{ match().status_text }}
    </div>
  </ion-card-content>
</ion-card>
